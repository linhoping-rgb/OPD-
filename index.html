<!doctype html><html lang="zh-Hant"><head>  <meta charset="utf-8" />  <meta name="viewport" content="width=device-width,initial-scale=1" />  <title>????</title>  <style>    body { font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; margin: 24px; }    .card { max-width: 720px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 16px; }    label { display:block; margin-top: 12px; font-weight: 600; }    input, select, button { width: 100%; padding: 10px 12px; margin-top: 6px; font-size: 16px; }    button { margin-top: 16px; cursor: pointer; }    .result { margin-top: 16px; padding: 12px; border-radius: 12px; background: #f6f6f6; white-space: pre-wrap; }    .muted { color:#666; font-size: 14px; margin-top: 8px; }  </style></head><body>  <div class="card">    <h1 style="margin:0 0 8px;">????</h1>    <div class="muted">??? ? ??? ? ?????? ? ??????</div>    <label for="dateSel">??</label>    <select id="dateSel"></select>    <label for="shiftSel">??</label>    <select id="shiftSel">      <option value="am">AM</option>      <option value="pm">PM</option>    </select>    <label for="empInput">????</label>    <input id="empInput" placeholder="???A12345 / 12345" autocomplete="off" inputmode="text" />    <button id="btn">??</button>    <div id="out" class="result">?????É</div>  </div><script>  // ???? CSV ???????  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ73XJN11lV6KeKkFbB04y_juagrgf8JdgZlXkKpGohe_7smwMmo_OFF4Bkm0LfM3f8CnXOcsVZaKQA/pub?output=csv";  const norm = (s) => (s ?? "")    .toString()    .replace(/\u3000/g, " ")    .replace(/\s+/g, " ")    .trim();  // ????????A-12345??A12345??  A12345 ?????  const normEmp = (s) => norm(s).replace(/[^0-9A-Za-z]/g, "").toUpperCase();  function parseCSV(text) {    const rows = [];    let row = [], cur = "", inQuotes = false;    for (let i = 0; i < text.length; i++) {      const ch = text[i];      const next = text[i + 1];      if (ch === '"' && inQuotes && next === '"') { cur += '"'; i++; continue; }      if (ch === '"') { inQuotes = !inQuotes; continue; }      if (ch === ',' && !inQuotes) { row.push(cur); cur = ""; continue; }      if ((ch === '\n' || ch === '\r') && !inQuotes) {        if (ch === '\r' && next === '\n') i++;        row.push(cur); rows.push(row);        row = []; cur = "";        continue;      }      cur += ch;    }    row.push(cur);    rows.push(row);    return rows.filter(r => r.some(cell => norm(cell) !== ""));  }  let table = [];  let colKeyToIndex = new Map(); // "1/5_am" -> col index  let dates = [];  let empColIndex = 0; // ??????????? A ??  async function load() {    const out = document.getElementById("out");    try {      const res = await fetch(CSV_URL, { cache: "no-store" });      if (!res.ok) throw new Error("CSV ????");      const text = await res.text();      table = parseCSV(text);      // ???? 3 ??index 2???????????????? ID???????????      // ??????????? A ??????????????????????      empColIndex = guessEmpColIndex(table);      const dateRow = table[0] || [];      const shiftRow = table[1] || [];      colKeyToIndex.clear();      const dateSet = new Set();      for (let c = 0; c < Math.max(dateRow.length, shiftRow.length); c++) {        const d = norm(dateRow[c]);        const sh = norm(shiftRow[c]).toLowerCase(); // "am" or "pm"        if (!d) continue;        if (sh !== "am" && sh !== "pm") continue;        dateSet.add(d);        colKeyToIndex.set(`${d}_${sh}`, c);      }      dates = Array.from(dateSet);      dates.sort((a,b)=>{        const pa=a.split('/').map(Number), pb=b.split('/').map(Number);        if (pa.length===2 && pb.length===2) return (pa[0]-pb[0]) || (pa[1]-pb[1]);        return a.localeCompare(b, 'zh-Hant');      });      const dateSel = document.getElementById("dateSel");      dateSel.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join("");      out.textContent = "???????????";    } catch (e) {      out.textContent = "???????? CSV ??????????";      console.error(e);    }  }  function guessEmpColIndex(t) {    // ?? 20 ?????    const startRow = 2;    const endRow = Math.min(t.length, startRow + 20);    const maxCols = Math.max(...t.map(r => r.length));    let best = 0, bestScore = -Infinity;    for (let c = 0; c < maxCols; c++) {      const vals = [];      for (let r = startRow; r < endRow; r++) {        vals.push(normEmp((t[r] || [])[c]));      }      const nonEmpty = vals.filter(v => v).length;      if (nonEmpty < Math.max(3, (endRow-startRow)*0.4)) continue;      const unique = new Set(vals.filter(v => v)).size;      const alnumRate = vals.filter(v => v && /^[0-9A-Z]+$/.test(v)).length / nonEmpty;      // ??????? + ?????      const score = unique * 2 + alnumRate * 5;      if (score > bestScore) {        bestScore = score;        best = c;      }    }    return best; // ????? 0  }  function findAssignment(dateStr, shift, empIdRaw) {    const out = document.getElementById("out");    const key = `${dateStr}_${shift}`;    const col = colKeyToIndex.get(key);    if (col === undefined) {      out.textContent = `??????${dateStr} ${shift.toUpperCase()}????????????`;      return;    }    const target = normEmp(empIdRaw);    if (!target) {      out.textContent = "??????????";      return;    }    let hitRow = -1;    for (let r = 2; r < table.length; r++) {      const row = table[r] || [];      const cellEmp = normEmp(row[empColIndex]);      if (!cellEmp) continue;      if (cellEmp === target) { hitRow = r; break; }    }    if (hitRow === -1) {      out.textContent = `????????${target}?`;      return;    }    const assignment = norm((table[hitRow] || [])[col]);    if (!assignment) {      out.textContent = `???? ${target}?${dateStr} ${shift.toUpperCase()}\n????????????`;      return;    }    out.textContent = `???? ${target}?${dateStr} ${shift.toUpperCase()}\n????${assignment}`;  }  document.getElementById("btn").addEventListener("click", () => {    const dateStr = document.getElementById("dateSel").value;    const shift = document.getElementById("shiftSel").value; // am/pm    const empId = document.getElementById("empInput").value;    findAssignment(dateStr, shift, empId);  });  // Enter ???  document.getElementById("empInput").addEventListener("keydown", (e) => {    if (e.key === "Enter") document.getElementById("btn").click();  });  load();</script></body></html>
